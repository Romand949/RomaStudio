<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Builder Engine</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; background: #1e1e1e; color: #ddd; user-select: none; }

  #app { display: flex; flex-direction: column; width: 100%; height: 100%; }

  /* Title bar */
  #titlebar { height: 24px; background: #181818; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #888; border-bottom: 1px solid #000; }

  /* Ribbon */
  #ribbon { background: #232323; border-bottom: 1px solid #000; display: flex; align-items: stretch; padding: 4px 8px; gap: 2px; }
  .ribbon-group { display: flex; align-items: center; gap: 4px; padding: 2px 10px; border-right: 1px solid #333; }
  .ribbon-group:last-child { border-right: none; }
  .rbtn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 56px; height: 52px; background: transparent; border: 1px solid transparent; border-radius: 3px; color: #ccc; font-size: 10px; cursor: pointer; }
  .rbtn:hover { background: #2f2f2f; border-color: #444; }
  .rbtn.active { background: #0a5fb4; border-color: #0a5fb4; color: #fff; }
  .rbtn .icon { font-size: 16px; }
  .rbtn.wide { width: 60px; }
  .rbtn.play { color: #4caf50; }
  .rbtn.stop { color: #e05353; }

  /* Body layout */
  #body { flex: 1; display: flex; min-height: 0; }

  /* Explorer */
  #explorer { width: 230px; background: #202020; border-right: 1px solid #000; display: flex; flex-direction: column; }
  .panel-title { padding: 6px 10px; font-size: 12px; color: #aaa; background: #262626; border-bottom: 1px solid #000; }
  #search-box { margin: 6px; padding: 4px 8px; background: #1a1a1a; border: 1px solid #3a3a3a; border-radius: 3px; color: #ccc; font-size: 12px; }
  #tree { flex: 1; overflow-y: auto; padding: 4px 0; font-size: 12.5px; }
  .tree-item { display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px 18px; cursor: pointer; white-space: nowrap; }
  .tree-item:hover { background: #2a2a2a; }
  .tree-item.selected { background: #0a5fb4; color: #fff; }
  .tree-item .tname { color: #ddd; }
  .tree-item.selected .tname { color: #fff; }
  .tree-item .tclass { color: #7a7a7a; font-size: 11px; }
  .tree-item.selected .tclass { color: #cfe4ff; }
  .indent-1 { padding-left: 30px; }
  .tico { width: 12px; text-align: center; font-size: 11px; }

  /* Viewport */
  #viewport-wrap { flex: 1; position: relative; background: #0f1420; min-width: 0; }
  #canvas-holder { width: 100%; height: 100%; }
  #vp-badge { position: absolute; top: 10px; left: 10px; background: rgba(20,20,20,0.85); border: 1px solid #3a3a3a; border-radius: 3px; padding: 6px 10px; font-size: 11px; color: #ccc; }
  #vp-badge b { color: #fff; display:block; font-size: 12px; }
  #stats { position: absolute; bottom: 10px; right: 10px; font-size: 11px; color: #8fd18f; background: rgba(20,20,20,0.85); padding: 4px 8px; border-radius: 3px; }
  .axis-gizmo { position: absolute; top: 10px; right: 10px; font-size: 11px; color: #999; background: rgba(20,20,20,0.85); padding: 4px 8px; border-radius: 3px; }

  /* Properties */
  #properties { width: 260px; background: #202020; border-left: 1px solid #000; display: flex; flex-direction: column; overflow-y: auto; }
  .prop-section { padding: 6px 10px 2px; font-size: 12px; color: #6fa8dc; font-weight: 600; border-bottom: 1px solid #2a2a2a; margin-top: 4px; }
  .prop-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 10px; font-size: 12px; gap: 8px; }
  .prop-row label { color: #aaa; flex: 1; }
  .prop-row .val-wrap { flex: 1.3; display: flex; gap: 3px; }
  .prop-input { width: 100%; background: #1a1a1a; border: 1px solid #3a3a3a; border-radius: 2px; color: #ddd; font-size: 11.5px; padding: 3px 5px; }
  .prop-input:focus { outline: 1px solid #0a5fb4; }
  .prop-input.xyz { text-align: center; }
  .color-swatch { width: 20px; height: 20px; border: 1px solid #555; border-radius: 2px; cursor: pointer; }
  .checkbox { width: 14px; height: 14px; }

  /* Output panel */
  #output-panel { height: 150px; background: #1a1a1a; border-top: 1px solid #000; display: flex; flex-direction: column; }
  #output-tabs { display: flex; background: #232323; border-bottom: 1px solid #000; }
  .out-tab { padding: 6px 16px; font-size: 12px; color: #999; cursor: pointer; border-right: 1px solid #000; }
  .out-tab.active { background: #1a1a1a; color: #fff; }
  #output-log { flex: 1; overflow-y: auto; padding: 6px 10px; font-family: 'Consolas', monospace; font-size: 11.5px; color: #9fd89f; line-height: 1.5; }
  #output-log .line { color: #b6d7b6; }
  #output-log .line.warn { color: #d7c76f; }
  #output-log .line.evt { color: #7ec8f0; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: #1a1a1a; }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">Builder Engine - Untitled</div>

  <div id="ribbon">
    <div class="ribbon-group">
      <div class="rbtn" id="btn-cut"><div class="icon">✂</div>Cut</div>
      <div class="rbtn" id="btn-copy"><div class="icon">⧉</div>Copy</div>
      <div class="rbtn" id="btn-paste"><div class="icon">📋</div>Paste</div>
    </div>
    <div class="ribbon-group">
      <div class="rbtn tool active" data-tool="select"><div class="icon">↖</div>Select</div>
      <div class="rbtn tool" data-tool="move"><div class="icon">✥</div>Move</div>
      <div class="rbtn tool" data-tool="scale"><div class="icon">⤢</div>Scale</div>
      <div class="rbtn tool" data-tool="rotate"><div class="icon">↻</div>Rotate</div>
    </div>
    <div class="ribbon-group">
      <div class="rbtn" id="btn-insert-part"><div class="icon">▣</div>Insert Part</div>
      <div class="rbtn" id="btn-delete"><div class="icon">🗑</div>Delete</div>
    </div>
    <div class="ribbon-group">
      <div class="rbtn play" id="btn-play"><div class="icon">▶</div>Play</div>
      <div class="rbtn stop" id="btn-stop"><div class="icon">■</div>Stop</div>
    </div>
  </div>

  <div id="body">
    <div id="explorer">
      <div class="panel-title">Explorer</div>
      <input id="search-box" placeholder="Search" />
      <div id="tree"></div>
    </div>

    <div id="viewport-wrap">
      <div id="canvas-holder"></div>
      <div id="vp-badge"><b id="vp-name">Baseplate</b>Tool: <span id="vp-tool">Select</span></div>
      <div class="axis-gizmo">Orbit: drag · Zoom: scroll · Pan: right-drag</div>
      <div id="stats">60 FPS</div>
    </div>

    <div id="properties">
      <div class="panel-title">Properties</div>
      <div id="prop-content"></div>
    </div>
  </div>

  <div id="output-panel">
    <div id="output-tabs">
      <div class="out-tab active">Output</div>
      <div class="out-tab">Problems</div>
    </div>
    <div id="output-log"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js"></script>
<script>
// ---------- Log ----------
const logEl = document.getElementById('output-log');
function log(msg, cls) {
  const d = document.createElement('div');
  d.className = 'line' + (cls ? ' ' + cls : '');
  const t = new Date();
  const ts = `[${t.toLocaleTimeString('en-GB')}]`;
  d.textContent = `${ts} ${msg}`;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

// ---------- Scene setup ----------
const holder = document.getElementById('canvas-holder');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1420);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 2000);
camera.position.set(14, 12, 16);

const renderer = new THREE.WebGLRenderer({ antialias: true });
holder.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

function resize() {
  const w = holder.clientWidth, h = holder.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

// Lighting
const hemi = new THREE.HemisphereLight(0x9fbfff, 0x1a1a1a, 0.6);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d0, 1.1);
sun.position.set(30, 40, 10);
scene.add(sun);

// Grid
const grid = new THREE.GridHelper(60, 60, 0x2a3a4a, 0x1a2530);
scene.add(grid);

// ---------- Object model ----------
let idCounter = 1;
const objects = {}; // id -> {mesh, name, className, color, size, position, rotation, anchored, canCollide, transparency, material}

function makeBoxMesh(color) {
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0.05 });
  return new THREE.Mesh(geo, mat);
}

function addPart(opts) {
  const id = 'obj' + (idCounter++);
  const mesh = makeBoxMesh(opts.color);
  mesh.position.set(...opts.position);
  mesh.scale.set(...opts.size);
  mesh.castShadow = true;
  scene.add(mesh);
  const obj = {
    id, name: opts.name, className: opts.className || 'Part',
    color: opts.color, position: opts.position.slice(), size: opts.size.slice(),
    rotation: opts.rotation || [0,0,0], anchored: true, canCollide: true,
    transparency: 0, material: 'Plastic', mesh, parent: opts.parent || 'Workspace'
  };
  objects[id] = obj;
  return obj;
}

function rgbToHex(r,g,b){ return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join(''); }

// Baseplate + demo house (recreating the reference scene)
const baseplate = addPart({ name: 'Baseplate', className:'Part', color: 0x268026, position:[0,-0.5,0], size:[60,1,60] });
addPart({ name:'Floor', className:'Part', color:0x9c8b6a, position:[0,0.15,0], size:[8,0.3,8] });
addPart({ name:'WallBack', className:'Part', color:0xd9d9d9, position:[0,2,-4], size:[8,4,0.3] });
addPart({ name:'WallLeft', className:'Part', color:0xd9d9d9, position:[-4,2,0], size:[0.3,4,8] });
addPart({ name:'WallRight', className:'Part', color:0xd9d9d9, position:[4,2,0], size:[0.3,4,8] });
addPart({ name:'WallFrontL', className:'Part', color:0xd9d9d9, position:[-2.6,2,4], size:[2.8,4,0.3] });
addPart({ name:'WallFrontR', className:'Part', color:0xd9d9d9, position:[2.6,2,4], size:[2.8,4,0.3] });
addPart({ name:'Roof', className:'Part', color:0x8b3a3a, position:[0,4.3,0], size:[9,0.4,9] });
addPart({ name:'BedFrame', className:'Part', color:0x6b4a2f, position:[-2.5,0.5,-2.5], size:[2,0.5,3] });
addPart({ name:'Mattress', className:'Part', color:0xe8e8e8, position:[-2.5,0.85,-2.5], size:[1.8,0.3,2.8] });

const spawn = addPart({ name:'SpawnLocation', className:'SpawnLocation', color:0x3a7fd9, position:[0,0.05,3], size:[4,0.1,4] });

log('builder engine ready.');
log('OpenTK viewport initialized.');
log('GLWpfControl started (OpenGL 4.0).');
log(`Scene ready: ${Object.keys(objects).length} objects.`, 'evt');

// ---------- Selection & gizmo ----------
let selectedId = null;
let currentTool = 'select';

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function selectObject(id) {
  selectedId = id;
  refreshTree();
  refreshProperties();
  const o = objects[id];
  document.getElementById('vp-name').textContent = o ? o.name : 'Nothing';
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const meshes = Object.values(objects).map(o => o.mesh);
  const hits = raycaster.intersectObjects(meshes);
  if (hits.length > 0) {
    const hitMesh = hits[0].object;
    const found = Object.values(objects).find(o => o.mesh === hitMesh);
    if (found) selectObject(found.id);
  }
});

// ---------- Explorer tree ----------
const treeEl = document.getElementById('tree');
const treeStructure = [
  { label: 'Workspace', cls: 'Workspace', kind: 'service', children: 'parts' },
  { label: 'Lighting', cls: 'Service', kind: 'service' },
  { label: 'Players', cls: 'Service', kind: 'service' },
  { label: 'StarterPack', cls: 'Container', kind: 'service' },
  { label: 'ReplicatedStorage', cls: 'Service', kind: 'service' },
  { label: 'ServerScriptService', cls: 'Service', kind: 'service' },
];

function refreshTree() {
  treeEl.innerHTML = '';
  treeStructure.forEach(node => {
    const row = document.createElement('div');
    row.className = 'tree-item';
    row.innerHTML = `<span class="tico">${node.kind==='service' ? '📁' : '▣'}</span><span class="tname">${node.label}</span> <span class="tclass">[${node.cls}]</span>`;
    treeEl.appendChild(row);
    if (node.children === 'parts') {
      Object.values(objects).forEach(o => {
        const child = document.createElement('div');
        child.className = 'tree-item indent-1' + (o.id === selectedId ? ' selected' : '');
        const icon = o.className === 'SpawnLocation' ? '🚩' : '▣';
        child.innerHTML = `<span class="tico">${icon}</span><span class="tname">${o.name}</span> <span class="tclass">[${o.className}]</span>`;
        child.addEventListener('click', () => selectObject(o.id));
        treeEl.appendChild(child);
      });
    }
  });
}

document.getElementById('search-box').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase();
  [...treeEl.querySelectorAll('.tree-item')].forEach(row => {
    row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
});

// ---------- Properties panel ----------
const propEl = document.getElementById('prop-content');

function propRow(label, inner) {
  return `<div class="prop-row"><label>${label}</label><div class="val-wrap">${inner}</div></div>`;
}

function refreshProperties() {
  const o = objects[selectedId];
  if (!o) { propEl.innerHTML = `<div class="prop-row"><label>Nothing selected</label></div>`; return; }
  const hex = '#' + o.mesh.material.color.getHexString();
  propEl.innerHTML = `
    <div class="prop-section">General</div>
    ${propRow('Name', `<input class="prop-input" id="p-name" value="${o.name}">`)}
    ${propRow('Class', `<input class="prop-input" value="${o.className}" disabled>`)}
    <div class="prop-section">Transform</div>
    ${propRow('Position', `
      <input class="prop-input xyz" id="p-px" type="number" step="0.5" value="${o.position[0]}">
      <input class="prop-input xyz" id="p-py" type="number" step="0.5" value="${o.position[1]}">
      <input class="prop-input xyz" id="p-pz" type="number" step="0.5" value="${o.position[2]}">`)}
    ${propRow('Size', `
      <input class="prop-input xyz" id="p-sx" type="number" step="0.5" min="0.1" value="${o.size[0]}">
      <input class="prop-input xyz" id="p-sy" type="number" step="0.5" min="0.1" value="${o.size[1]}">
      <input class="prop-input xyz" id="p-sz" type="number" step="0.5" min="0.1" value="${o.size[2]}">`)}
    ${propRow('Rotation Y', `<input class="prop-input" id="p-roty" type="number" step="5" value="${o.rotation[1]}">`)}
    <div class="prop-section">Appearance</div>
    ${propRow('Color', `<input type="color" class="color-swatch" id="p-color" value="${hex}">`)}
    <div class="prop-section">Behavior</div>
    ${propRow('Anchored', `<input type="checkbox" class="checkbox" id="p-anchored" ${o.anchored ? 'checked' : ''}>`)}
    ${propRow('CanCollide', `<input type="checkbox" class="checkbox" id="p-collide" ${o.canCollide ? 'checked' : ''}>`)}
  `;

  document.getElementById('p-name').addEventListener('change', e => {
    o.name = e.target.value; refreshTree();
    document.getElementById('vp-name').textContent = o.name;
  });
  ['px','py','pz'].forEach((k, i) => {
    document.getElementById('p-'+k).addEventListener('input', e => {
      o.position[i] = parseFloat(e.target.value) || 0;
      o.mesh.position.set(...o.position);
    });
  });
  ['sx','sy','sz'].forEach((k, i) => {
    document.getElementById('p-'+k).addEventListener('input', e => {
      o.size[i] = Math.max(0.1, parseFloat(e.target.value) || 0.1);
      o.mesh.scale.set(...o.size);
    });
  });
  document.getElementById('p-roty').addEventListener('input', e => {
    o.rotation[1] = parseFloat(e.target.value) || 0;
    o.mesh.rotation.y = THREE.MathUtils.degToRad(o.rotation[1]);
  });
  document.getElementById('p-color').addEventListener('input', e => {
    const c = new THREE.Color(e.target.value);
    o.mesh.material.color = c;
  });
  document.getElementById('p-anchored').addEventListener('change', e => o.anchored = e.target.checked);
  document.getElementById('p-collide').addEventListener('change', e => o.canCollide = e.target.checked);
}

// ---------- Ribbon actions ----------
document.querySelectorAll('.rbtn.tool').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.rbtn.tool').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTool = btn.dataset.tool;
    document.getElementById('vp-tool').textContent = currentTool[0].toUpperCase() + currentTool.slice(1);
    log(`Tool -> ${currentTool[0].toUpperCase() + currentTool.slice(1)}`);
  });
});

document.getElementById('btn-insert-part').addEventListener('click', () => {
  const colors = [0x3a7fd9, 0xd97757, 0x7fd93a, 0xd9c93a, 0xa03ad9];
  const c = colors[Math.floor(Math.random() * colors.length)];
  const o = addPart({ name: 'Part', className: 'Part', color: c, position: [0, 3, 0], size: [4, 4, 4] });
  selectObject(o.id);
  log(`Inserted Part (${o.id})`, 'evt');
});

document.getElementById('btn-delete').addEventListener('click', () => {
  if (!selectedId || !objects[selectedId]) return;
  const o = objects[selectedId];
  scene.remove(o.mesh);
  log(`Deleted ${o.name}`, 'warn');
  delete objects[selectedId];
  selectedId = null;
  refreshTree();
  refreshProperties();
});

let playing = false;
document.getElementById('btn-play').addEventListener('click', () => {
  if (playing) return;
  playing = true;
  log('Play', 'evt');
});
document.getElementById('btn-stop').addEventListener('click', () => {
  if (!playing) return;
  playing = false;
  log('Stop', 'evt');
});

['btn-cut','btn-copy','btn-paste'].forEach(id => {
  document.getElementById(id).addEventListener('click', () => log(id.replace('btn-','') + ' (not implemented in this preview)'));
});

// ---------- Render loop ----------
let lastTime = performance.now();
let frames = 0, fpsAccum = 0;
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);

  frames++;
  const now = performance.now();
  if (now - lastTime > 500) {
    const fps = Math.round((frames * 1000) / (now - lastTime));
    document.getElementById('stats').textContent = fps + ' FPS';
    frames = 0; lastTime = now;
  }
}

resize();
refreshTree();
refreshProperties();
selectObject(spawn.id);
animate();
</script>
</body>
</html>
